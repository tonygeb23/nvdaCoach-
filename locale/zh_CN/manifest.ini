summary = "NVDA Coach - 交互式屏幕阅读器训练"
description = """
NVDA Coach 是一款面向 NVDA 屏幕阅读器的交互式训练插件。
它通过简短的实践练习帮助你掌握 NVDA 命令。
你无需阅读手册，而是在语音反馈的引导下进行实时练习。
本插件专为初学者以及刚开始接触屏幕阅读器的人设计。
要开始使用，请按 NVDA+Shift+C。
Coach 窗口将会打开，其中包含课程介绍和课程选择器。
用光标键选择一课，然后按回车键。
每节课由一系列步骤组成。
对于需要执行命令的步骤，请切换到其他窗口，完成操作后按 NVDA+Shift+C 返回 Coach 窗口。
对于包含内置文本的步骤，可直接在 Coach 窗口中练习。
课程进行期间，以下按键始终可用：
• 回车键——进入下一步
• F1——重复当前指令
• F2——获取当前步骤的提示
• F3——跳过当前步骤
• Escape——停止课程
完成一课后，按 Ctrl+N 进入下一课，按 Ctrl+B 返回上一课，按 Ctrl+R 重新开始本课。
插件会记住已完成的课程，并在列表中加以标记。
学习进度保存在 NVDA 的配置文件夹中。
NVDA Coach 目前包含六章，顺序如下：
• 《NVDA 入门》
• 《认识你的键盘》
• 《阅读和浏览文本》
• 《浏览模式与网页导航》
• 《对象导航》
• 《自定义 NVDA》
课程包含内置练习环境：
• 实时练习表单，用于练习 Tab 导航和控件操作
• 文本区域，可直接在 Coach 窗口中练习阅读和选择文本
• 独立的练习网页，用于练习按标题、链接和表单导航
本插件由辅助技术讲师 Tony Gebhard 开发。
"""
