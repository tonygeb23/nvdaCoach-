summary = "NVDA Coach - 交互式屏幕阅读器训练"
description = """
NVDA Coach 是一个面向 NVDA 屏幕阅读器的交互式训练插件。
它通过简短的实践练习，帮助您掌握常用的 NVDA 命令。
与阅读手册不同，您可以在 NVDA 中实时练习，并获得语音反馈。
此插件专为初学者和刚接触屏幕阅读器的用户设计。

要开始使用，请按 NVDA+Shift+C。
随后会打开 NVDA Coach 窗口，显示简介和课程列表。
使用光标键选择课程，然后按回车键开始。
每节课由一系列步骤组成。
需要练习命令的步骤中，请切换到相应窗口执行操作，再按 NVDA+Shift+C 返回 NVDA Coach 窗口继续。
包含内嵌文本的步骤可直接在 NVDA Coach 窗口中练习。

课程中随时可用的按键包括：
- 回车键：进入下一步
- F1：重复当前说明
- F2：读出当前步骤的提示
- F3：跳过当前步骤
- Escape：停止课程

完成一节课后，可使用 Ctrl+N 转到下一课，Ctrl+B 返回上一课，Ctrl+R 重新开始当前课程。
插件会记住已完成的课程，并在课程列表中标记进度。
进度保存在 NVDA 用户配置文件夹中。

NVDA Coach 目前包含六个章节：
- NVDA 入门
- 您的键盘
- 阅读和浏览文本
- 浏览模式和网页导航
- 对象导航
- 自定义 NVDA

课程包含内置练习环境：
- 用于练习 Tab 导航和激活控件的交互式表单
- 用于阅读、选择和文本导航练习的内嵌文本区
- 用于练习标题、链接、表单、表格和列表导航的网页

此插件由辅助技术讲师 Tony Gebhard 创建。
"""
